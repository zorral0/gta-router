<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GTA Router</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- served locally (web/vendor/) so an internet blip can't blank the app -->
<link href="vendor/maplibre-gl.css" rel="stylesheet">
<script src="vendor/maplibre-gl.js"></script>
<style>
  /* SOLID surfaces (Apple-material pass, 2026-07-19): the old translucent
     gray-on-gray read muddy - now the sheet, cards and chips are opaque
     with real contrast (dark mode: black cards on a #1b sheet). */
  :root {
    --panel: #f4f4f6; --card: #ffffff;
    --card-solid: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
    --accent: #007aff; --good: #248a3d; --bad: #ff3b30;
    --line: rgba(0,0,0,.08); --chip: #e7e7ec;
    --shadow: 0 0 0 .5px rgba(0,0,0,.08), 0 12px 36px rgba(0,0,0,.16);
    --card-shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --panel: #1b1b1d; --card: #000000;
      --card-solid: #2c2c2e; --text: #f5f5f7; --muted: #98989d;
      --accent: #0a84ff; --good: #30d158; --bad: #ff453a;
      --line: rgba(255,255,255,.09); --chip: #2c2c2e;
      --shadow: 0 0 0 .5px rgba(255,255,255,.09), 0 12px 36px rgba(0,0,0,.6);
      --card-shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 13.5px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text",
         "Segoe UI", Roboto, sans-serif; color: var(--text);
         -webkit-font-smoothing: antialiased; overflow: hidden; }
  #map { position: absolute; inset: 0; }

  /* floating panel */
  #panel { position: absolute; top: 14px; left: 14px;
    width: min(384px, calc(100vw - 28px));
    max-height: calc(100% - 28px); display: flex; flex-direction: column;
    background: var(--panel);
    border-radius: 20px; box-shadow: var(--shadow); overflow: hidden;
    transform-origin: top left;
    /* no fill-mode: the panel must settle to transform:none, otherwise the
       retained scale(1) makes #panel a containing block that clips the fixed
       "More" menu against its own overflow:hidden */
    animation: panelIn .62s cubic-bezier(.2,.7,.3,1); }
  /* playful first-impression entrance: drop in, overshoot, unblur into focus.
     Runs once on load, so a little expressiveness is earned here. */
  @keyframes panelIn {
    0%   { opacity: 0; transform: translateY(-14px) scale(.93); filter: blur(7px); }
    60%  { opacity: 1; transform: translateY(4px)   scale(1.02); filter: blur(0);  }
    100% { opacity: 1; transform: translateY(0)     scale(1);    filter: blur(0);  }
  }
  #panelScroll { overflow-y: auto; padding: 14px 14px 16px; }
  #panelScroll::-webkit-scrollbar { width: 8px; }
  #panelScroll::-webkit-scrollbar-thumb { background: var(--chip); border-radius: 4px; }

  .wordmark { font-size: 17px; font-weight: 800; letter-spacing: -.01em;
    color: var(--text); margin: 2px 2px 12px; }

  /* search fields */
  .search { background: var(--card); border-radius: 12px;
    box-shadow: 0 0 0 .5px var(--line), var(--card-shadow);
    padding: 4px 12px; margin-bottom: 10px;
    /* stays pinned so you never lose sight of where you're routing while
       the results scroll underneath it */
    position: sticky; top: 0; z-index: 4; }
  .srow { display: flex; align-items: center; gap: 10px; position: relative; }
  .srow + .srow { border-top: .5px solid var(--line); }
  .srow .pt { width: 10px; height: 10px; border-radius: 50%; flex: none;
    cursor: pointer; box-shadow: 0 0 0 0 rgba(0,0,0,0);
    transition: box-shadow .15s ease, transform .1s ease; }
  .srow .pt:hover { box-shadow: 0 0 0 3px var(--chip); }
  /* the "armed" dot: your next map click drops THIS point. Halo in the dot's
     own colour, separated from the core by a card-coloured gap. */
  .srow .pt.active { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px currentColor; }
  .srow .pt.active:hover { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px currentColor; }
  .srow .pt:active { transform: scale(.85); }
  .srow input { flex: 1; border: none; outline: none; background: transparent;
    color: var(--text); font: inherit; padding: 11px 0; min-width: 0; }
  .srow input::placeholder { color: var(--muted); }

  /* search suggestions */
  .sug { position: absolute; left: -12px; right: -12px; top: calc(100% + 1px);
    background: var(--card-solid); border-radius: 12px; z-index: 40;
    box-shadow: 0 0 0 .5px var(--line), 0 10px 30px rgba(0,0,0,.22);
    overflow: hidden; display: none; }
  .sug.open { display: block; }
  .sug .item { padding: 9px 14px; cursor: pointer; }
  .sug .item + .item { border-top: .5px solid var(--line); }
  .sug .item.hi, .sug .item:hover { background: var(--accent); }
  .sug .item.hi .p1, .sug .item:hover .p1,
  .sug .item.hi .p2, .sug .item:hover .p2 { color: #fff; }
  .sug .p1 { font-size: 13px; font-weight: 600; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .sug .p2 { font-size: 11.5px; color: var(--muted); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }

  /* controls */
  .ctrls { display: flex; gap: 7px; align-items: center; flex-wrap: wrap;
    margin-bottom: 12px; }
  .ctrls select, .optrow select, .selbtn { appearance: none; -webkit-appearance: none; border: none;
    background: var(--chip); color: var(--text); font: inherit; font-size: 12.5px;
    font-weight: 590; height: 32px; padding: 0 22px 0 11px; border-radius: 999px;
    cursor: pointer;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='9' height='6'%3E%3Cpath d='M1 1l3.5 3.5L8 1' stroke='%23888' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 10px center; }
  /* Themed dropdowns. A native <select>'s option popup is drawn by the OS
     and cannot be styled, so it always looked like a system menu bolted
     onto the app. The real <select> stays in the DOM as the source of
     truth (its options, .value and change events - nothing else had to
     change), but goes invisible; .selbtn shows the current label and
     .selmenu draws the list in the same material as the "More" menu. */
  .selwrap { position: relative; display: inline-flex; }
  .selwrap select { position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; pointer-events: none; }
  .selbtn { display: inline-flex; align-items: center; white-space: nowrap; }
  .selbtn[aria-expanded="true"] { background: var(--accent); color: #fff;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='9' height='6'%3E%3Cpath d='M1 1l3.5 3.5L8 1' stroke='%23fff' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 10px center; }
  /* fixed, like #moreMenu: the panel's scroll box must not clip it */
  .selmenu { position: fixed; z-index: 60; display: none; padding: 6px;
    background: var(--card-solid); border-radius: 12px; box-shadow: var(--shadow);
    max-height: min(320px, 60vh); overflow-y: auto; min-width: 132px; }
  .selmenu.open { display: block; }
  .sel-item { display: flex; align-items: center; gap: 10px; width: 100%;
    border: none; background: none; color: var(--text); font: inherit;
    font-size: 13px; font-weight: 550; padding: 8px 10px; border-radius: 8px;
    cursor: pointer; text-align: left; white-space: nowrap; }
  .sel-item:hover, .sel-item.hi { background: var(--chip); }
  .sel-item.on { font-weight: 650; }
  .sel-tick { margin-left: auto; color: var(--accent); font-size: 12px;
    visibility: hidden; }
  .sel-item.on .sel-tick { visibility: visible; }
  .seg { display: inline-flex; background: var(--chip); border-radius: 999px;
    padding: 2px; }
  .seg button { border: none; background: transparent; padding: 5.5px 10px;
    border-radius: 999px; font: inherit; font-size: 12px; font-weight: 600;
    color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--card-solid); color: var(--text);
    box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .ibtn { border: none; background: var(--chip); color: var(--text);
    width: 30px; height: 30px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; }
  .ibtn:hover, .ctrls select:hover, .optrow select:hover, .selbtn:hover { filter: brightness(.96); }
  @media (prefers-color-scheme: dark) { .ibtn:hover, .ctrls select:hover, .optrow select:hover, .selbtn:hover { filter: brightness(1.25); } }
  #go { border: none; background: var(--accent); color: #fff; font: inherit;
    font-size: 13px; font-weight: 650; padding: 7px 16px; border-radius: 999px;
    cursor: pointer; margin-left: auto; }
  #go:active { filter: brightness(.9); }

  .icn { width: 1em; height: 1em; vertical-align: -0.12em; fill: none;
    stroke: currentColor; stroke-width: 2; stroke-linecap: round;
    stroke-linejoin: round; }

  /* result sections */
  .sect { margin-top: 14px; }
  .sect h2 { display: flex; align-items: center; gap: 7px; margin: 0 2px 7px;
    font-size: 12px; font-weight: 650; letter-spacing: .04em;
    text-transform: uppercase; color: var(--muted); }
  .sect h2 .icn { font-size: 14px; }
  .card { background: var(--card); border-radius: 14px;
    box-shadow: 0 0 0 .5px var(--line), var(--card-shadow);
    padding: 13px 15px; cursor: pointer; margin-bottom: 8px;
    transition: transform .14s ease, box-shadow .14s ease;
    animation: rise .3s cubic-bezier(.2,.7,.3,1) both; }
  .card:hover { transform: translateY(-1px);
    box-shadow: 0 0 0 .5px var(--line), 0 6px 18px rgba(0,0,0,.10); }
  .card:active { transform: scale(.985); }
  /* the picked trip is a full accent card, Apple-style - every inner
     piece flips to white-on-blue */
  .card.sel { background: var(--accent); box-shadow: none; }
  .card.sel, .card.sel .mins, .card.sel .cost { color: #fff; }
  .card.sel .times, .card.sel .via, .card.sel .badge,
  .card.sel .livechip, .card.sel .alertchip, .card.sel .sep
    { color: rgba(255,255,255,.85); }
  .card.sel .gchip { background: rgba(255,255,255,.22); color: #fff; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .head { display: flex; align-items: baseline; gap: 8px; }
  /* one big number per card; everything else stays small and quiet */
  .mins { font-size: 24px; font-weight: 700; letter-spacing: -.03em;
    font-variant-numeric: tabular-nums; white-space: nowrap; flex-shrink: 0; }
  .times { color: var(--muted); font-size: 12px;
    font-variant-numeric: tabular-nums; min-width: 0; }
  .cost { margin-left: auto; font-size: 15px; font-weight: 650;
    color: var(--text); font-variant-numeric: tabular-nums;
    white-space: nowrap; flex-shrink: 0; padding-left: 6px; }
  /* badges are quiet colored words now, not uppercase pills */
  .badges { display: flex; gap: 12px; margin-top: 3px; }
  .badge { font-size: 12.5px; font-weight: 650; padding: 0; }
  .badge::before { content: "\25CF"; font-size: 8px; vertical-align: 1.5px;
    margin-right: 5px; }
  .badge.fast { color: var(--accent); }
  .badge.cheap { color: var(--good); }
  .badge.late { color: var(--muted); }
  /* real-time markers: "live" on cards, late/early notes on detail legs */
  .livechip { color: var(--good); font-size: 9.5px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; margin-left: 2px; }
  .livechip::before { content: "●"; font-size: 7px; vertical-align: 1px;
    margin-right: 3px; animation: livepulse 1.6s ease-in-out infinite; }
  @keyframes livepulse { 50% { opacity: .35; } }
  .late { color: #ff9f0a; font-weight: 600; }
  .early { color: var(--accent); font-weight: 600; }
  /* service alerts: amber ⚠ chip on cards, per-leg note in detail; the
     full list lives in the "More" (⋯) menu, styled under .mm-alerts */
  .alertchip { color: #ff9f0a; font-size: 11px; margin-left: 4px; vertical-align: 1px; }
  .legalert { margin-top: 6px; background: color-mix(in srgb, #ff9f0a 12%, transparent);
    border-radius: 8px; padding: 6px 8px; font-size: 12px; }
  .legalert > summary { display: flex; align-items: flex-start; gap: 5px;
    cursor: pointer; list-style: none; color: #d98500; font-weight: 600; }
  .legalert > summary::-webkit-details-marker { display: none; }
  .legalert .icn { color: #ff9f0a; flex: none; margin-top: 1px; }
  .legalert .ah { flex: 1; }
  .legalert .amore { color: var(--muted); font-weight: 500; font-size: 11px; }
  .legalert[open] .amore { display: none; }
  .legalert .ad { margin: 5px 0 0 17px; color: var(--text); font-weight: 400;
    white-space: pre-line; }
  .legalert .al { display: inline-block; margin: 5px 0 0 17px; color: var(--accent);
    font-weight: 600; text-decoration: none; }
  .legs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
    margin-top: 8px; }
  .rt { color: #fff; font-weight: 700; font-size: 11.5px; padding: 2.5px 8px;
    border-radius: 6px; box-shadow: inset 0 -1px 0 rgba(0,0,0,.18); }
  .gchip { display: inline-flex; align-items: center; gap: 4px;
    color: var(--muted); font-size: 11.5px; font-weight: 550;
    background: var(--chip); border-radius: 6px; padding: 2.5px 7px; }
  .sep { color: var(--muted); opacity: .5; font-size: 9px; }
  /* Apple-style leg row: mode glyphs + colored route badges joined by
     chevrons. Exact distances now live in the trip detail view. */
  .legrow { display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
    margin-top: 9px; color: var(--text); font-size: 17px; }
  .lg { display: inline-flex; align-items: center; gap: 5px; }
  .legrow .rt { font-size: 11px; padding: 2px 7px; }
  .csep { color: var(--muted); opacity: .55; font-size: 13px; display: inline-flex; }
  .lgwalk { display: inline-flex; align-items: center; gap: 3px;
    color: var(--muted); font-size: 12px; font-weight: 550; }
  .card.sel .legrow { color: #fff; }
  .card.sel .csep, .card.sel .lgwalk { color: rgba(255,255,255,.8); }
  .morebtn { display: block; width: 100%; border: none; background: transparent;
    color: var(--accent); font: inherit; font-size: 12.5px; font-weight: 600;
    padding: 4px; cursor: pointer; border-radius: 8px; }
  .morebtn:hover { background: var(--chip); }
  .extra { display: none; }
  .extra.open { display: block; }

  /* "what you have" toggles - gate which mode mixes get searched */
  .have { border: none; cursor: pointer; font: inherit; font-size: 12.5px;
    font-weight: 600; display: inline-flex; align-items: center; gap: 5px;
    height: 32px; padding: 0 13px; border-radius: 999px;
    background: var(--chip); color: var(--muted); }
  .have.on { background: var(--accent); color: #fff; }
  .have:active { transform: scale(.96); }
  /* collapsed "Options" drawer - the extra controls live behind one chip */
  #optWrap { display: none; }
  #optWrap.open { display: block; margin-bottom: 2px; }
  /* the drawer is grouped under quiet labels so seven controls read as
     organized, not dumped */
  .optgrp { margin-top: 11px; }
  .optgrp:first-child { margin-top: 3px; }
  .optlbl { font-size: 11px; font-weight: 700; letter-spacing: .02em;
    text-transform: uppercase; color: var(--muted); margin: 0 2px 6px; }
  .optrow { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
  /* four loose pills wrapped 3+1 and read as a pile. Grouped instead by
     the thing you own - Bike / Car, two choices each - so the toggles
     land in two aligned columns. */
  .haverow { flex-wrap: nowrap; }
  .haverow + .haverow { margin-top: 6px; }
  .havelbl { font-size: 11.5px; font-weight: 600; color: var(--muted);
    width: 34px; flex: none; }
  .haverow .have { flex: 1; min-width: 0; justify-content: center; }
  /* drive-distance slider (replaced a 4-step dropdown: 8/15/30/Any hid
     everything in between, and 15 km is exactly where the useful
     park-and-ride stations start) */
  .optrow.sliderrow { display: block; padding: 0 2px; }
  /* the slider's label IS a group header (.optlbl) so it sits at the same
     size and weight as "Preferences" / "Who's riding", with the live value
     right-aligned on the same line */
  .optlbl.slbl { display: flex; justify-content: space-between; align-items: baseline; }
  .slbl b { color: var(--text); font-weight: 700; font-size: 12px;
    text-transform: none; letter-spacing: 0; }
  .slider { -webkit-appearance: none; appearance: none; width: 100%; height: 20px;
    background: transparent; cursor: pointer; margin: 0; display: block; }
  .slider:focus { outline: none; }
  .slider:focus-visible::-webkit-slider-thumb { box-shadow: 0 1px 3px rgba(0,0,0,.3),
    0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
  .slider::-webkit-slider-runnable-track { height: 4px; border-radius: 999px;
    background: linear-gradient(to right, var(--accent) var(--pct, 0%),
      var(--chip) var(--pct, 0%)); }
  .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; border-radius: 50%; background: #fff; margin-top: -7px;
    box-shadow: 0 1px 3px rgba(0,0,0,.3), 0 0 0 .5px rgba(0,0,0,.08); }
  .slider:active::-webkit-slider-thumb { transform: scale(1.12); }
  .slider::-moz-range-track { height: 4px; border-radius: 999px; background: var(--chip); }
  .slider::-moz-range-progress { height: 4px; border-radius: 999px; background: var(--accent); }
  .slider::-moz-range-thumb { width: 18px; height: 18px; border: none; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  /* the filter is allowed to hide fast options - say so instead of
     silently dropping them (this is what hid the Fairview trips). One
     quiet chip row, not a paragraph of blue text. */
  .slhint { display: flex; align-items: center; gap: 8px; width: 100%;
    border: none; background: var(--chip); color: var(--muted); font: inherit;
    font-size: 11.5px; font-weight: 550; text-align: left; cursor: pointer;
    padding: 7px 10px; border-radius: 10px; margin-top: 6px; }
  .slhint:hover { filter: brightness(.96); }
  @media (prefers-color-scheme: dark) { .slhint:hover { filter: brightness(1.25); } }
  .slhint .sh-txt { flex: 1; min-width: 0; }
  .slhint .sh-act { color: var(--accent); font-weight: 650; flex: none; }
  .slhint[hidden] { display: none; }

  /* one-line mode summary on mixed-mode cards */
  .via { font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 4px; }

  .hint { color: var(--muted); font-size: 12.5px; text-align: center;
    padding: 22px 10px; }
  .none { color: var(--muted); font-size: 12px; padding: 10px;
    border: 1px dashed var(--line); border-radius: 12px; text-align: center; }
  .err { color: var(--bad); font-size: 12.5px; padding: 6px 2px;
    white-space: pre-wrap; }
  .sugmsg { padding: 10px 14px; color: var(--muted); font-size: 12px; }
  .warnbar { background: color-mix(in srgb, var(--bad) 12%, transparent);
    color: var(--bad); font-size: 11.5px; font-weight: 600;
    border-radius: 10px; padding: 7px 10px; margin: -4px 2px 10px; }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .loading { display: flex; align-items: center; justify-content: center;
    gap: 10px; color: var(--muted); padding: 28px 0; font-size: 12.5px; }
  .spinner { width: 16px; height: 16px; border-radius: 50%;
    border: 2.5px solid var(--chip); border-top-color: var(--accent);
    animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* detail view */
  #detail { display: none; }
  body.detail-open #results { display: none; }
  body.detail-open #detail { display: block;
    animation: slidein .32s cubic-bezier(.2,.7,.3,1) both; }
  /* comes in from the right with a tiny overshoot + materialize */
  @keyframes slidein {
    0%   { opacity: 0; transform: translateX(26px) scale(.98); filter: blur(4px); }
    70%  { opacity: 1; transform: translateX(-3px) scale(1);   filter: blur(0);   }
    100% { opacity: 1; transform: translateX(0)    scale(1);   filter: blur(0);   }
  }
  /* exit is quieter than the entrance (attention is already moving on) */
  body.detail-closing #results { display: none; }
  body.detail-closing #detail { display: block;
    animation: slideout .22s cubic-bezier(.4,0,1,1) both; }
  @keyframes slideout {
    to { opacity: 0; transform: translateX(14px) scale(.99); filter: blur(3px); }
  }
  .ibtn:active, #go:active, .seg button:active, .back:active,
  .morebtn:active { transform: scale(.94); }

  /* Accessibility: honour reduced-motion. Disables the entrances, the detail
     slide, and the pre-existing looping "live" pulses while preserving final
     states so nothing breaks. Required for every animation in this file. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* zoom controls restyled to match the app (Sam 2026-07-20: the stock
     +/- felt cheap): app card material, rounded, our own +/- glyphs */
  .maplibregl-ctrl-group { background: var(--card-solid) !important;
    border-radius: 12px !important; box-shadow: var(--shadow) !important;
    overflow: hidden; }
  .maplibregl-ctrl-group button { width: 34px !important; height: 34px !important;
    background: transparent !important; }
  .maplibregl-ctrl-group button + button {
    border-top: .5px solid var(--line) !important; }
  .maplibregl-ctrl-group button:hover { background: var(--chip) !important; }
  .maplibregl-ctrl-group button:active { background: var(--chip) !important; }
  /* hide MapLibre's baked-in icon images; draw crisp glyphs instead */
  .maplibregl-ctrl-zoom-in .maplibregl-ctrl-icon,
  .maplibregl-ctrl-zoom-out .maplibregl-ctrl-icon { background-image: none !important; }
  .maplibregl-ctrl-zoom-in, .maplibregl-ctrl-zoom-out { position: relative; }

<body>
<div id="map"></div>

<div id="panel"><div id="panelScroll">
  <div class="wordmark">GTA Router</div>

<script>
"use strict";
/* if the vendored map library is missing, say so instead of a blank page */
if (typeof maplibregl === "undefined"){
  document.body.innerHTML = '<div style="display:flex;height:100%;align-items:center;justify-content:center;font:15px/1.5 -apple-system,sans-serif;color:#6e6e73;text-align:center;padding:30px">The map library didn&#39;t load &mdash; the web/vendor/ files are missing or unreadable.<br>Restore them, then reload this page.</div>';

function loadStored(key, fallback){
  try { const v = JSON.parse(localStorage.getItem(key) || "null");
        return (v && typeof v === "object") ? v : fallback; }
  catch (e){ return fallback; }
}

  car: '<path d="m21 8-2 2-1.5-3.7A2 2 0 0 0 15.646 5H8.4a2 2 0 0 0-1.903 1.257L5 10 3 8"/><path d="M7 14h.01"/><path d="M17 14h.01"/><rect width="18" height="8" x="3" y="10" rx="2"/><path d="M5 18v2"/><path d="M19 18v2"/>',

/* ---- fare model: keep in sync with costs.py ---- */
// [name-match, adult fare, youth fare (null = not modelled), verified?]
// ALL verified 2026-07-18 against each agency's official fare page
// (PRESTO-level; unverified fares would say so in the UI via the flag)
const LOCAL_FARES = [["TTC",3.30,2.35,true],["TORONTO",3.30,2.35,true],
                     ["YORK",4.24,3.29,true],["MIWAY",3.50,2.90,true],
                     ["DURHAM",3.84,3.46,true],["BRAMPTON",3.55,2.95,true]];
// UP: PRESTO fares, distance-based 4.71-5.02 - flat worst case modelled.
// (12.35 was the paper/standard fare, not what a PRESTO rider pays.)
const GO_BASE = 3.70, GO_PER_KM = 0.11, UP_FARE = 5.02, UP_YOUTH = 3.39,
      ONE_FARE = true;
const GO_YOUTH_FACTOR = 0.60;  // 40% off, gotransit.com youth discount
const GAS_PER_KM = 0.14, WEAR_PER_KM = 0.10, DOWNTOWN_PARKING = 25.0, GO_PARKING = 0.0;
// Bike Share Toronto pay-as-you-go, classic bike: $1 unlock + 12 cents/min
// (verified Jul 2026, bikesharetoronto.com/pricing; e-bikes 20 cents/min
// not modelled - OTP doesn't tell us which kind we'd get)
const BIKESHARE_UNLOCK = 1.00, BIKESHARE_PER_MIN = 0.12;
const TRANSIT = new Set(["BUS","RAIL","SUBWAY","TRAM","FERRY"]);
let rider = "adult";
let maxDriveM = 15000;  // hide drive-to-station options with a longer drive
/* bike routing trade-off: the ENGINE default is safest-streets
   (router-config.json); "balanced"/"fastest" override it per request so
   busier roads are allowed when they save time */
let bikePref = localStorage.getItem("bikePref") || "safest";
if (!["safest", "balanced", "fastest"].includes(bikePref)) bikePref = "safest";
const BIKE_OPT = { balanced: "SAFE_STREETS", fastest: "SHORTEST_DURATION" };
/* "Leave at" (false) vs "Arrive by" (true) - which end of the trip the
   picked time pins down. Not persisted: each visit starts on Leave at. */
let arriveBy = false;

/* GO's real station-to-station fare table (made by make_go_fares.py). */
let GO_FARES = null;
fetch("go-fares.json").then(r => r.json()).then(j => { GO_FARES = j; })
  .catch(() => {});

/* Which subway car to ride, per station + direction (see the file's _about
   for the source and its limits). Missing station = no diagram, no harm. */
let BOARDING = null;
fetch("subway-boarding.json").then(r => r.json()).then(j => { BOARDING = j; })
  .catch(() => {});

const normStation = n =>
  (n || "").split(" Station")[0].toLowerCase().replace(/['.’]/g, "").trim();
function subwayDirToken(l){
  const hs = (l.headsign || "").toLowerCase();
  for (const t of ["vaughan","finch","kipling","kennedy","don mills","sheppard-yonge"])
    if (hs.includes(t)) return t.replace(/[ -]/g, "");
  return null;
}
/* best car for subway leg i: the exit position at the station you get OFF
   at - or the transfer position if the next ride is another subway line */
function boardingInfo(legs, i){
  const l = legs[i];
  if (!BOARDING || l.mode !== "SUBWAY") return null;
  const st = BOARDING.stations[normStation(l.to.name)];
  const tok = subwayDirToken(l);
  const e = st && tok ? st[tok] : null;
  if (!e) return null;
  let pick = { car: e.car, of: e.of || 6, why: e.why };
  const nxt = legs.slice(i + 1).find(x => x.mode !== "WALK");
  if (e.transfer && nxt && nxt.mode === "SUBWAY"){
    const tr = e.transfer[((nxt.route || {}).shortName || "") + ":" + subwayDirToken(nxt)]
            || e.transfer[(nxt.route || {}).shortName || ""];
    if (tr) pick = { car: tr.car, of: tr.of || e.of || 6, why: tr.why };
  }
  return pick;
}
function trainDiagram(p, stationName){
  let cars = "";
  for (let c = p.of; c >= 1; c--)  // front of the train is drawn on the right
    cars += `<span class="bcar${c === p.car ? " hot" : ""}${c === 1 ? " nose" : ""}">${c === p.car ? p.car : ""}</span>`;
  const ord = ["", "1st", "2nd", "3rd"][p.car] || p.car + "th";
  return `<div class="btrain">${cars}<span class="bdir">${icn("arrow", 11)}</span></div>
    <div class="bnote">Get on the <b>${ord} car from the front</b> (of ${p.of})
      &mdash; at ${esc(stationName)} it lines up with ${esc(p.why)}.</div>`;
}

function stopIdOf(place){
  const id = ((place || {}).stop || {}).gtfsId || "";
  return id.startsWith("GO:") ? id.slice(3) : null;
}
function goTableFare(fromStop, toStop){
  if (!GO_FARES || !fromStop || !toStop) return null;
  const o = GO_FARES.zones[fromStop], d = GO_FARES.zones[toStop];
  if (!o || !d) return null;
  const p = GO_FARES.fares[o + "|" + d] ?? GO_FARES.fares[d + "|" + o];
  return p ?? null;
}

function agencyOf(l){ return ((l.agency||{}).name||"").toUpperCase(); }
function prettyAgency(a){
  if (a.includes("GO")) return "GO Transit";
  if (a.includes("UP")) return "UP Express";
  if (a.includes("TTC") || a.includes("TORONTO")) return "TTC";
  if (a.includes("YORK")) return "YRT";
  if (a.includes("MIWAY")) return "MiWay";
  if (a.includes("DURHAM")) return "DRT";
  if (a.includes("BRAMPTON")) return "Brampton Transit";
  return a;
}

function itineraryCostDetail(it){
  const legs = it.legs, tlegs = legs.filter(l => TRANSIT.has(l.mode));
  const items = [];
  const goLegs = tlegs.filter(l => agencyOf(l).includes("GO"));
  const usedGo = goLegs.length > 0;
  if (usedGo){
    const exact = goTableFare(stopIdOf(goLegs[0].from),
                              stopIdOf(goLegs[goLegs.length-1].to));
    let f, label;
    if (exact != null){ f = exact; label = "GO Transit"; }
    else {
      const goKm = goLegs.reduce((s,l) => s + (l.distance||0)/1000, 0);
      f = GO_BASE + GO_PER_KM * goKm;
      label = "GO Transit (estimated)";
    }
    if (rider === "youth"){ f *= GO_YOUTH_FACTOR; label += " — youth 40% off"; }
    items.push({ label, amount: f });
  }
  if (tlegs.some(l => agencyOf(l).includes("UP")))
    items.push({ label: "UP Express" + (rider === "youth" ? " — youth" : ""),
                 amount: rider === "youth" ? UP_YOUTH : UP_FARE });
  const ridden = [];
  for (const l of tlegs){
    const a = agencyOf(l);
    const hit = LOCAL_FARES.find(([k]) => a.includes(k));
    if (hit && !ridden.some(r => r.a === a))
      ridden.push({ a, fare: (rider === "youth" && hit[2] != null) ? hit[2] : hit[1],
                    ver: hit[3] });
  }
  ridden.forEach((r, i) => {
    const free = ONE_FARE && (usedGo || i > 0);
    items.push({ label: prettyAgency(r.a)
      + (free ? " — free (One Fare transfer)"
              : (r.ver ? "" : " — fare unverified")), amount: free ? 0 : r.fare });
  });
  legs.forEach((l,i) => {
    if (l.mode === "BICYCLE" && l.rentedBike){
      const mins = Math.ceil((l.duration||0)/60);
      items.push({ label: `Bike Share (${mins} min, $1 + 12¢/min)`,
                   amount: BIKESHARE_UNLOCK + mins * BIKESHARE_PER_MIN });
    }
    if (l.mode === "CAR"){
      const later = legs.slice(i+1).some(x => TRANSIT.has(x.mode));
      const earlier = legs.slice(0,i).some(x => TRANSIT.has(x.mode));
      const km = (l.distance||0)/1000;
      items.push({ label: `Driving (${km.toFixed(1)} km, gas + wear)`,
                   amount: km * (GAS_PER_KM + WEAR_PER_KM) });
      if (later){ if (GO_PARKING > 0) items.push({ label: "Station parking", amount: GO_PARKING }); }
      // car AFTER transit = a pickup or your car already waiting - no
      // parking fee; only a start-of-trip drive to the destination pays it.
      // (Unreachable in the app today - trips without transit are filtered
      // out before pricing. Kept so the model matches costs.py, which DOES
      // price pure-car trips for carprobe comparisons.)
      else if (!earlier) items.push({ label: "Downtown parking", amount: DOWNTOWN_PARKING });
    }
  });
  return { total: items.reduce((s,x) => s + x.amount, 0), items };
}
function itineraryCost(it){ return itineraryCostDetail(it).total; }

/* repaint every layer of the liberty style with one palette. Grouping is
   by source-layer + layer-id substrings, so it survives minor upstream
   style updates; anything unrecognized keeps its original color. */
function recolorStyle(base, p){
  const s = JSON.parse(JSON.stringify(base));
  s.layers = s.layers.filter(l => {
    if (l.id === "natural_earth" && p.dark) return false; // photo backdrop
    if (p.dropPois && /^poi_r/.test(l.id)) return false;  // POI icon clutter
    return true;
  });
  // Curate POIs to a few important landmark classes (Sam 2026-07-23: "just a
  // few important ones" - drop shops/parking/bins). Applies to every look.
  const POI_KEEP = ["hospital","university","college","museum","aquarium",
    "stadium","monument","attraction","theatre","cinema","library","town_hall",
    "police","fire_station","place_of_worship","park","railway","ferry_terminal"];
  const poiClassFilter = ["match", ["get","class"], POI_KEEP, true, false];
  for (const l of s.layers){
    if (l["source-layer"] === "poi" && /^poi_r/.test(l.id)){
      l.filter = (Array.isArray(l.filter) && l.filter[0] === "all")
        ? [...l.filter, poiClassFilter] : ["all", poiClassFilter];
    } else if (l.id === "poi_transit"){
      l.filter = ["match", ["get","class"], ["airport","rail"], true, false];
    }
  }
  for (const l of s.layers){
    l.paint = l.paint || {};
    const id = l.id, sl = l["source-layer"] || "";
    if (l.type === "background"){ l.paint["background-color"] = p.land; continue; }
    if (l.type === "fill"){
      let c = null;
      if (sl === "water") c = p.water;
      else if (sl === "landcover")
        c = /wood|wetland/.test(id) ? p.wood : /sand/.test(id) ? p.sand
          : /ice/.test(id) ? p.land : p.grass;
      else if (sl === "park") c = p.park;
      else if (sl === "landuse")
        c = /residential/.test(id) ? p.residential
          : /cemetery|pitch|track/.test(id) ? p.grass : p.civic;
      else if (sl === "building") c = p.building;
      else if (sl === "aeroway") c = p.aeroway;
      else if (sl === "transportation") c = p.road1;
      if (c){ l.paint["fill-color"] = c; delete l.paint["fill-pattern"];
              delete l.paint["fill-outline-color"]; }
      if (id === "building-3d") l.paint["fill-extrusion-color"] = p.building;
      continue;
    }
    if (l.type === "fill-extrusion"){ l.paint["fill-extrusion-color"] = p.building; continue; }
    if (l.type === "line"){
      let c = null;
      if (sl === "waterway") c = p.water;
      else if (sl === "boundary") c = p.boundary;
      else if (sl === "park") c = p.park;
      else if (sl === "aeroway") c = p.road1;
      else if (sl === "transportation"){
        const casing = /casing/.test(id);
        if (/rail|transit/.test(id)) c = p.rail;
        else if (/motorway/.test(id)) c = casing ? p.casing3 : p.road3;
        else if (/trunk|primary/.test(id)) c = casing ? p.casing2 : p.road2;
        else if (/secondary|tertiary/.test(id)) c = casing ? p.casing15 : p.road15;
        else if (/path|pedestrian|pier|bridleway/.test(id)) c = p.path;
        else c = casing ? p.casing1 : p.road1;
      }
      if (c) l.paint["line-color"] = c;
      continue;
    }
    if (l.type === "symbol"){
      let c = p.label, halo = 1.2;
      if (sl === "place") c = /city|capital|state/.test(id) ? p.strong : p.label;
      else if (sl === "transportation_name"){ c = p.roadLabel; halo = 1.3; }
      else if (sl === "water_name" || sl === "waterway") c = p.waterLabel;
      else if (sl === "poi" || sl === "aerodrome_label") c = p.poiLabel;
      l.paint["text-color"] = c;
      l.paint["text-halo-color"] = p.halo;
      l.paint["text-halo-width"] = halo;
    }
  }
  return s;
}

/* Ontario King's Highway crown shields (Sam's request 2026-07-23). The liberty
   style draws plain sprite boxes for the 400-series; we swap in the real
   public-domain crown shield artwork (web/highway-shield.svg), recolored per
   theme, drawn small and low-opacity so it blends into the map. Re-runs on
   every style load (theme flips reset added images + layer props). */
const SHIELD_REFS = ["400","401","403","404","407","409","410","412","418","420","427"];
const SHIELD_LAYERS = ["highway-shield-non-us","highway-shield-us-interstate","road_shield_us"];
let shieldSvgBase = null;
async function shieldBase(){
  if (shieldSvgBase) return shieldSvgBase;
  const raw = await (await fetch("highway-shield.svg")).text();
  const open = raw.match(/<svg[^>]*>/)[0];
  const nOpen = open.replace(/width="[^"]*"/, 'width="46"').replace(/height="[^"]*"/, 'height="73"');
  shieldSvgBase = raw.replace(open, nOpen);
  return shieldSvgBase;
}
function shieldRecolor(s, accent, body){
  if (accent) s = s.split("fill:#000000").join("fill:" + accent).split("fill:#231f20").join("fill:" + accent)
                   .split('fill="#000000"').join('fill="' + accent + '"').split('fill="#231f20"').join('fill="' + accent + '"');
  if (body) s = s.split("fill:#ffffff").join("fill:" + body).split('fill="#ffffff"').join('fill="' + body + '"');
  return s;
}
async function applyShields(dark){
  let base;
  try { base = await shieldBase(); } catch (e){ return; }  // asset missing: keep default boxes
  const v = dark ? { accent: "#d3a441", body: "#2b2f36", num: "#f4f4f8", op: 0.5 }
                 : { accent: "#1a1a1a", body: "#ffffff", num: "#1a1a1a", op: 0.72 };
  for (const num of SHIELD_REFS){
    const svg = shieldRecolor(base, v.accent, v.body).replace("</svg>",
      '<text x="113.7" y="250" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"'
      + ' font-weight="700" font-size="118" fill="' + v.num + '">' + num + "</text></svg>");
    const img = new Image();
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    try { await (img.decode ? img.decode() : new Promise((res, rej) => { img.onload = res; img.onerror = rej; })); }
    catch (e){ continue; }
    const id = "onsh_" + num;
    if (map.hasImage(id)) map.removeImage(id);
    map.addImage(id, img, { pixelRatio: 2 });
  }
  const iconExpr = ["coalesce", ["image", ["concat", "onsh_", ["get", "ref"]]],
                    ["image", ["concat", "road_", ["get", "ref_length"]]]];
  for (const id of SHIELD_LAYERS){
    if (!map.getLayer(id)) continue;
    map.setLayoutProperty(id, "icon-image", iconExpr);
    map.setLayoutProperty(id, "icon-size", 0.54);
    map.setLayoutProperty(id, "icon-text-fit", "none");
    map.setPaintProperty(id, "icon-opacity", v.op);
    map.setPaintProperty(id, "text-opacity", 0);
  }
}
function reapplyShields(){
  const look = mapLook[themeMode()];
  const dark = look === "classic" ? darkMql.matches : (PALETTES[look] || {}).dark;
  applyShields(!!dark);
}
map.on("style.load", reapplyShields);  // first style load

(function(){
  const btn = document.createElement("button");
  btn.id = "lookBtn"; btn.title = "Map look";
  btn.setAttribute("aria-label", "Choose the map's look");
  btn.innerHTML = icn("layers", 18);

  document.body.append(btn, pop);
  function renderPop(){

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GTA Router</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- served locally (web/vendor/) so an internet blip can't blank the app -->
<link href="vendor/maplibre-gl.css" rel="stylesheet">
<!-- MapLibre 6 ships only as ES modules. This exposes it as the global the
     rest of the app has always used. Module and defer scripts run in document
     order once the page is parsed, so core.js and app.js always see it. If the
     files are missing, app.js finds no maplibregl and says so on screen. -->
<script type="module">
  import * as maplibregl from "./vendor/maplibre-gl.mjs";
  window.maplibregl = maplibregl;
</script>
<!-- the app's rules (fares, tolls, ranking, Toronto time): no map, no page,
     so tests/core.test.mjs can run them without a browser -->
<script defer src="core.js"></script>
<style>
  /* Solid surfaces: the sheet, cards and chips are opaque for contrast
     (dark mode: black cards on a #1b sheet). */
  :root {
    --panel: #f4f4f6; --card: #ffffff;
    --card-solid: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
    --accent: #007aff; --good: #248a3d; --bad: #ff3b30;
    --line: rgba(0,0,0,.08); --chip: #e7e7ec;
    --shadow: 0 0 0 .5px rgba(0,0,0,.08), 0 12px 36px rgba(0,0,0,.16);
    --card-shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --panel: #1b1b1d; --card: #000000;
      --card-solid: #2c2c2e; --text: #f5f5f7; --muted: #98989d;
      --accent: #0a84ff; --good: #30d158; --bad: #ff453a;
      --line: rgba(255,255,255,.09); --chip: #2c2c2e;
      --shadow: 0 0 0 .5px rgba(255,255,255,.09), 0 12px 36px rgba(0,0,0,.6);
      --card-shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 13.5px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text",
         "Segoe UI", Roboto, sans-serif; color: var(--text);
         -webkit-font-smoothing: antialiased; overflow: hidden; }
  #map { position: absolute; inset: 0; }

  /* floating panel */
  #panel { position: absolute; top: 14px; left: 14px;
    width: min(384px, calc(100vw - 28px));
    max-height: calc(100% - 28px); display: flex; flex-direction: column;
    background: var(--panel);
    border-radius: 20px; box-shadow: var(--shadow); overflow: hidden;
    transform-origin: top left;
    /* no fill-mode: the panel must settle to transform:none, otherwise the
       retained scale(1) makes #panel a containing block that clips the fixed
       "More" menu against its own overflow:hidden */
    animation: panelIn .62s cubic-bezier(.2,.7,.3,1); }
  /* playful first-impression entrance: drop in, overshoot, unblur into focus.
     Runs once on load, so a little expressiveness is earned here. */
  @keyframes panelIn {
    0%   { opacity: 0; transform: translateY(-14px) scale(.93); filter: blur(7px); }
    60%  { opacity: 1; transform: translateY(4px)   scale(1.02); filter: blur(0);  }
    100% { opacity: 1; transform: translateY(0)     scale(1);    filter: blur(0);  }
  }
  #panelScroll { overflow-y: auto; padding: 14px 14px 16px; }
  #panelScroll::-webkit-scrollbar { width: 8px; }
  #panelScroll::-webkit-scrollbar-thumb { background: var(--chip); border-radius: 4px; }

  .wordmark { font-size: 17px; font-weight: 800; letter-spacing: -.01em;
    color: var(--text); margin: 2px 2px 12px; }

  /* search fields */
  .search { background: var(--card); border-radius: 12px;
    box-shadow: 0 0 0 .5px var(--line), var(--card-shadow);
    padding: 4px 12px; margin-bottom: 10px;
    /* stays pinned so you never lose sight of where you're routing while
       the results scroll underneath it */
    position: sticky; top: 0; z-index: 4; }
  /* #panelScroll's 14px top padding is a transparent strip ABOVE the pinned
     card, so scrolled content (the blue Trip options pills) showed through it
     and appeared sliced across the top of the panel. Cap it in the panel
     colour, pulled out to the panel's edges. */
  .search::before { content: ""; position: absolute; left: -14px; right: -14px;
    top: -15px; height: 15px; background: var(--panel); }
  .srow { display: flex; align-items: center; gap: 10px; position: relative; }
  .srow + .srow { border-top: .5px solid var(--line); }
  .srow .pt { width: 10px; height: 10px; border-radius: 50%; flex: none;
    cursor: pointer; box-shadow: 0 0 0 0 rgba(0,0,0,0);
    transition: box-shadow .15s ease, transform .1s ease; }
  .srow .pt:hover { box-shadow: 0 0 0 3px var(--chip); }
  /* the "armed" dot: your next map click drops THIS point. Halo in the dot's
     own colour, separated from the core by a card-coloured gap. */
  .srow .pt.active { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px currentColor; }
  .srow .pt.active:hover { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px currentColor; }
  .srow .pt:active { transform: scale(.85); }
  .srow input { flex: 1; border: none; outline: none; background: transparent;
    color: var(--text); font: inherit; padding: 11px 0; min-width: 0; }
  .srow input::placeholder { color: var(--muted); }

  /* search suggestions.
     Fixed, not absolute: the list lives inside #panelScroll, which sits in
     #panel's overflow:hidden box, so an absolutely positioned list got sliced
     off at the panel's bottom edge - with a short panel the last 2 of 8
     suggestions were invisible and unclickable. Same trick as #moreMenu; JS
     sets left/top/width/max-height on open (see place() in attachSuggest). */
  .sug { position: fixed; z-index: 40;
    background: var(--card-solid); border-radius: 12px;
    box-shadow: 0 0 0 .5px var(--line), 0 10px 30px rgba(0,0,0,.22);
    overflow-y: auto; overscroll-behavior: contain; display: none; }
  .sug.open { display: block; }
  .sug .item { padding: 9px 14px; cursor: pointer; }
  .sug .item + .item { border-top: .5px solid var(--line); }
  .sug .item.hi, .sug .item:hover { background: var(--accent); }
  .sug .item.hi .p1, .sug .item:hover .p1,
  .sug .item.hi .p2, .sug .item:hover .p2 { color: #fff; }
  .sug .p1 { font-size: 13px; font-weight: 600; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .sug .p2 { font-size: 11.5px; color: var(--muted); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }

  /* controls */
  .ctrls { display: flex; gap: 7px; align-items: center; flex-wrap: wrap;
    margin-bottom: 12px; }
  .ctrls select, .optrow select, .selbtn { appearance: none; -webkit-appearance: none; border: none;
    background: var(--chip); color: var(--text); font: inherit; font-size: 12.5px;
    font-weight: 590; height: 32px; padding: 0 22px 0 11px; border-radius: 999px;
    cursor: pointer;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='9' height='6'%3E%3Cpath d='M1 1l3.5 3.5L8 1' stroke='%23888' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 10px center; }
  /* Themed dropdowns. A native <select>'s option popup is drawn by the OS
     and cannot be styled, so it always looked like a system menu bolted
     onto the app. The real <select> stays in the DOM as the source of
     truth (its options, .value and change events - nothing else had to
     change), but goes invisible; .selbtn shows the current label and
     .selmenu draws the list in the same material as the "More" menu. */
  .selwrap { position: relative; display: inline-flex; }
  .selwrap select { position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; pointer-events: none; }
  .selbtn { display: inline-flex; align-items: center; white-space: nowrap; }
  .selbtn[aria-expanded="true"] { background: var(--accent); color: #fff;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='9' height='6'%3E%3Cpath d='M1 1l3.5 3.5L8 1' stroke='%23fff' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 10px center; }
  /* fixed, like #moreMenu: the panel's scroll box must not clip it */
  .selmenu { position: fixed; z-index: 60; display: none; padding: 6px;
    background: var(--card-solid); border-radius: 12px; box-shadow: var(--shadow);
    max-height: min(320px, 60vh); overflow-y: auto; min-width: 132px; }
  .selmenu.open { display: block; }
  .sel-item { display: flex; align-items: center; gap: 10px; width: 100%;
    border: none; background: none; color: var(--text); font: inherit;
    font-size: 13px; font-weight: 550; padding: 8px 10px; border-radius: 8px;
    cursor: pointer; text-align: left; white-space: nowrap; }
  .sel-item:hover, .sel-item.hi { background: var(--chip); }
  .sel-item.on { font-weight: 650; }
  .sel-tick { margin-left: auto; color: var(--accent); font-size: 12px;
    visibility: hidden; }
  .sel-item.on .sel-tick { visibility: visible; }
  /* month grid: same popup material, one screen per month. A day is a
     button only when #daySel has an option for it, so the past and
     anything past the end of the loaded timetables is dead text. */
  .selmenu-cal { padding: 10px; overflow: visible; }
  .cal-head { display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px; }
  .cal-title { font-size: 13px; font-weight: 650; color: var(--text); }
  .cal-nav { border: none; background: none; color: var(--accent); cursor: pointer;
    font-size: 19px; line-height: 1; width: 26px; height: 26px; border-radius: 999px; }
  .cal-nav:hover { background: var(--chip); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 30px); gap: 2px; }
  .cal-dow { font-size: 10.5px; font-weight: 700; color: var(--muted);
    text-align: center; padding-bottom: 2px; }
  .cal-day { height: 30px; border: none; background: none; color: var(--text);
    font: inherit; font-size: 12.5px; font-weight: 550; border-radius: 999px;
    cursor: pointer; padding: 0; }
  .cal-day:hover, .cal-day.hi { background: var(--chip); }
  .cal-day.today { font-weight: 800; color: var(--accent); }
  .cal-day.on { background: var(--accent); color: #fff; font-weight: 700; }
  .cal-day.off { color: var(--muted); opacity: .3; cursor: default;
    display: flex; align-items: center; justify-content: center; }
  .cal-foot { font-size: 11px; font-weight: 550; color: var(--muted);
    text-align: center; margin-top: 8px; }
  .seg { display: inline-flex; background: var(--chip); border-radius: 999px;
    padding: 2px; }
  .seg button { border: none; background: transparent; padding: 5.5px 10px;
    border-radius: 999px; font: inherit; font-size: 12px; font-weight: 600;
    color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--card-solid); color: var(--text);
    box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .ibtn { border: none; background: var(--chip); color: var(--text);
    width: 30px; height: 30px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; }
  .ibtn:hover, .ctrls select:hover, .optrow select:hover, .selbtn:hover { filter: brightness(.96); }
  @media (prefers-color-scheme: dark) { .ibtn:hover, .ctrls select:hover, .optrow select:hover, .selbtn:hover { filter: brightness(1.25); } }
  #go { border: none; background: var(--accent); color: #fff; font: inherit;
    font-size: 13px; font-weight: 650; padding: 7px 16px; border-radius: 999px;
    cursor: pointer; margin-left: auto; }
  #go:active { filter: brightness(.9); }

  .icn { width: 1em; height: 1em; vertical-align: -0.12em; fill: none;
    stroke: currentColor; stroke-width: 2; stroke-linecap: round;
    stroke-linejoin: round; }

  /* result sections */
  .sect { margin-top: 14px; }
  .sect h2 { display: flex; align-items: center; gap: 7px; margin: 0 2px 7px;
    font-size: 12px; font-weight: 650; letter-spacing: .04em;
    text-transform: uppercase; color: var(--muted); }
  .sect h2 .icn { font-size: 14px; }
  .card { background: var(--card); border-radius: 14px;
    box-shadow: 0 0 0 .5px var(--line), var(--card-shadow);
    padding: 13px 15px; cursor: pointer; margin-bottom: 8px;
    transition: transform .14s ease, box-shadow .14s ease;
    animation: rise .3s cubic-bezier(.2,.7,.3,1) both; }
  .card:hover { transform: translateY(-1px);
    box-shadow: 0 0 0 .5px var(--line), 0 6px 18px rgba(0,0,0,.10); }
  .card:active { transform: scale(.985); }
  /* the picked trip is a full accent card, Apple-style - every inner
     piece flips to white-on-blue */
  .card.sel { background: var(--accent); box-shadow: none; }
  .card.sel, .card.sel .mins, .card.sel .cost { color: #fff; }
  .card.sel .times, .card.sel .badge, .card.sel .livechip, .card.sel .alertchip
    { color: rgba(255,255,255,.85); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .head { display: flex; align-items: baseline; gap: 8px; }
  /* one big number per card; everything else stays small and quiet */
  .mins { font-size: 24px; font-weight: 700; letter-spacing: -.03em;
    font-variant-numeric: tabular-nums; white-space: nowrap; flex-shrink: 0; }
  .times { color: var(--muted); font-size: 12px;
    font-variant-numeric: tabular-nums; min-width: 0; }
  .cost { margin-left: auto; font-size: 15px; font-weight: 650;
    color: var(--text); font-variant-numeric: tabular-nums;
    white-space: nowrap; flex-shrink: 0; padding-left: 6px; }
  /* badges are quiet colored words now, not uppercase pills */
  .badges { display: flex; gap: 12px; margin-top: 3px; }
  .badge { font-size: 12.5px; font-weight: 650; padding: 0; }
  .badge::before { content: "\25CF"; font-size: 8px; vertical-align: 1.5px;
    margin-right: 5px; }
  .badge.fast { color: var(--accent); }
  .badge.cheap { color: var(--good); }
  .badge.late { color: var(--muted); }
  /* real-time markers: "live" on cards, late/early notes on detail legs */
  .livechip { color: var(--good); font-size: 9.5px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; margin-left: 2px; }
  .livechip::before { content: "●"; font-size: 7px; vertical-align: 1px;
    margin-right: 3px; animation: livepulse 1.6s ease-in-out infinite; }
  @keyframes livepulse { 50% { opacity: .35; } }
  /* a drive on the 407, with what it costs. Amber like the alert chip so it
     reads as "watch out, there is money here that isn't a fare".
     nowrap: the chip carries a dollar figure now, and letting it break
     between "toll" and the amount left the price stranded on its own line. */
  .tollchip { color: #ff9f0a; font-size: 9.5px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; margin-left: 5px;
    background: color-mix(in srgb, #ff9f0a 16%, transparent);
    padding: 1px 5px; border-radius: 5px; white-space: nowrap; }
  .card.sel .tollchip { color: #fff; background: rgba(255,255,255,.24); }
  .late { color: #ff9f0a; font-weight: 600; }
  .early { color: var(--accent); font-weight: 600; }
  /* service alerts: amber ⚠ chip on cards, per-leg note in detail; the
     full list lives in the "More" (⋯) menu, styled under .mm-alerts */
  .alertchip { color: #ff9f0a; font-size: 11px; margin-left: 4px; vertical-align: 1px; }
  .legalert { margin-top: 6px; background: color-mix(in srgb, #ff9f0a 12%, transparent);
    border-radius: 8px; padding: 6px 8px; font-size: 12px; }
  .legalert > summary { display: flex; align-items: flex-start; gap: 5px;
    cursor: pointer; list-style: none; color: #d98500; font-weight: 600; }
  .legalert > summary::-webkit-details-marker { display: none; }
  .legalert .icn { color: #ff9f0a; flex: none; margin-top: 1px; }
  .legalert .ah { flex: 1; }
  .legalert .amore { color: var(--muted); font-weight: 500; font-size: 11px; }
  .legalert[open] .amore { display: none; }
  .legalert .ad { margin: 5px 0 0 17px; color: var(--text); font-weight: 400;
    white-space: pre-line; }
  .legalert .al { display: inline-block; margin: 5px 0 0 17px; color: var(--accent);
    font-weight: 600; text-decoration: none; }
  .rt { color: #fff; font-weight: 700; font-size: 11.5px; padding: 2.5px 8px;
    border-radius: 6px; box-shadow: inset 0 -1px 0 rgba(0,0,0,.18); }
  /* Apple-style leg row: mode glyphs + colored route badges joined by
     chevrons. Exact distances now live in the trip detail view. */
  .legrow { display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
    margin-top: 9px; color: var(--text); font-size: 17px; }
  .lg { display: inline-flex; align-items: center; gap: 5px; }
  .legrow .rt { font-size: 11px; padding: 2px 7px; }
  .csep { color: var(--muted); opacity: .55; font-size: 13px; display: inline-flex; }
  .lgwalk { display: inline-flex; align-items: center; gap: 3px;
    color: var(--muted); font-size: 12px; font-weight: 550; }
  .card.sel .legrow { color: #fff; }
  .card.sel .csep, .card.sel .lgwalk { color: rgba(255,255,255,.8); }
  .morebtn { display: block; width: 100%; border: none; background: transparent;
    color: var(--accent); font: inherit; font-size: 12.5px; font-weight: 600;
    padding: 4px; cursor: pointer; border-radius: 8px; }
  .morebtn:hover { background: var(--chip); }
  .extra { display: none; }
  .extra.open { display: block; }

  /* "what you have" toggles - gate which mode mixes get searched */
  .have { border: none; cursor: pointer; font: inherit; font-size: 12.5px;
    font-weight: 600; display: inline-flex; align-items: center; gap: 5px;
    height: 32px; padding: 0 13px; border-radius: 999px;
    background: var(--chip); color: var(--muted); }
  .have.on { background: var(--accent); color: #fff; }
  .have:active { transform: scale(.96); }
  /* The Trip options row. Its second line lists what's inside while
     everything is default, and switches to what you have changed as soon
     as anything is off-default, so a filter can never sit collapsed and
     quietly drop trips. */
  .optsrow { display: flex; align-items: center; gap: 11px; width: 100%;
    border: none; cursor: pointer; font: inherit; text-align: left;
    color: var(--text); background: var(--card); border-radius: 13px;
    padding: 10px 12px; margin-bottom: 12px; box-shadow: var(--card-shadow); }
  .optsrow:hover { filter: brightness(.98); }
  @media (prefers-color-scheme: dark) { .optsrow:hover { filter: brightness(1.35); } }
  .optsrow:active { transform: scale(.995); }
  .optsrow .oi { color: var(--accent); font-size: 17px; flex: none; display: flex; }
  .optsrow .otx { min-width: 0; flex: 1; }
  .optsrow .ott { display: block; font-size: 13.5px; font-weight: 620;
    letter-spacing: -.01em; }
  /* wraps instead of truncating: a cut-off list of changed settings would
     hide exactly what this row is meant to show */
  .optsrow .osub { display: block; font-size: 11.5px; color: var(--muted);
    margin-top: 1px; line-height: 1.35; }
  /* off-default reads as a live setting, not as helper text */
  .optsrow.set .osub { color: var(--accent); font-weight: 600; }
  /* inline-flex, not inline: a bare inline span ignores transform, so the
     chevron silently never rotated */
  .optsrow .ochev { color: var(--muted); flex: none; font-size: 13px;
    display: inline-flex; transition: transform .2s ease; }
  .optsrow.on .ochev { transform: rotate(180deg); }
  /* collapsed "Options" drawer - the extra controls live behind one chip */
  #optWrap { display: none; }
  /* Capped and self-scrolling: fully expanded this block is ~490px, which on
     a laptop pushed the results and the itinerary clean off the bottom of the
     panel, so you couldn't see what your own toggles had just done. */
  #optWrap.open { display: block; margin-bottom: 2px;
    max-height: min(42vh, 380px); overflow-y: auto;
    overscroll-behavior: contain; }
  /* the drawer is grouped under quiet labels so seven controls read as
     organized, not dumped */
  .optgrp { margin-top: 11px; }
  .optgrp:first-child { margin-top: 3px; }
  .optlbl { font-size: 11px; font-weight: 700; letter-spacing: .02em;
    text-transform: uppercase; color: var(--muted); margin: 0 2px 6px; }
  .optrow { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
  /* four loose pills wrapped 3+1 and read as a pile. Grouped instead by
     the thing you own - Bike / Car, two choices each - so the toggles
     land in two aligned columns. */
  .haverow { flex-wrap: nowrap; }
  .haverow + .haverow { margin-top: 6px; }
  .havelbl { font-size: 11.5px; font-weight: 600; color: var(--muted);
    width: 34px; flex: none; }
  .haverow .have { flex: 1; min-width: 0; justify-content: center; }
  /* drive-distance slider (replaced a 4-step dropdown: 8/15/30/Any hid
     everything in between, and 15 km is exactly where the useful
     park-and-ride stations start) */
  .optrow.sliderrow { display: block; padding: 0 2px; }
  /* the slider's label IS a group header (.optlbl) so it sits at the same
     size and weight as "Preferences" / "Who's riding", with the live value
     right-aligned on the same line */
  .optlbl.slbl { display: flex; justify-content: space-between; align-items: baseline; }
  .slbl b { color: var(--text); font-weight: 700; font-size: 12px;
    text-transform: none; letter-spacing: 0; }
  .slider { -webkit-appearance: none; appearance: none; width: 100%; height: 20px;
    background: transparent; cursor: pointer; margin: 0; display: block; }
  .slider:focus { outline: none; }
  .slider:focus-visible::-webkit-slider-thumb { box-shadow: 0 1px 3px rgba(0,0,0,.3),
    0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
  .slider::-webkit-slider-runnable-track { height: 4px; border-radius: 999px;
    background: linear-gradient(to right, var(--accent) var(--pct, 0%),
      var(--chip) var(--pct, 0%)); }
  .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; border-radius: 50%; background: #fff; margin-top: -7px;
    box-shadow: 0 1px 3px rgba(0,0,0,.3), 0 0 0 .5px rgba(0,0,0,.08); }
  .slider:active::-webkit-slider-thumb { transform: scale(1.12); }
  .slider::-moz-range-track { height: 4px; border-radius: 999px; background: var(--chip); }
  .slider::-moz-range-progress { height: 4px; border-radius: 999px; background: var(--accent); }
  .slider::-moz-range-thumb { width: 18px; height: 18px; border: none; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  /* the filter is allowed to hide fast options, but says so instead of
     silently dropping them. One quiet chip row, not a paragraph of text. */
  .slhint { display: flex; align-items: center; gap: 8px; width: 100%;
    border: none; background: var(--chip); color: var(--muted); font: inherit;
    font-size: 11.5px; font-weight: 550; text-align: left; cursor: pointer;
    padding: 7px 10px; border-radius: 10px; margin-top: 6px; }
  .slhint:hover { filter: brightness(.96); }
  @media (prefers-color-scheme: dark) { .slhint:hover { filter: brightness(1.25); } }
  .slhint .sh-txt { flex: 1; min-width: 0; }
  .slhint .sh-act { color: var(--accent); font-weight: 650; flex: none; }
  .slhint[hidden] { display: none; }

  .hint { color: var(--muted); font-size: 12.5px; text-align: center;
    padding: 22px 10px; }
  .none { color: var(--muted); font-size: 12px; padding: 10px;
    border: 1px dashed var(--line); border-radius: 12px; text-align: center; }
  .err { color: var(--bad); font-size: 12.5px; padding: 6px 2px;
    white-space: pre-wrap; }
  .sugmsg { padding: 10px 14px; color: var(--muted); font-size: 12px; }
  .warnbar { background: color-mix(in srgb, var(--bad) 12%, transparent);
    color: var(--bad); font-size: 11.5px; font-weight: 600;
    border-radius: 10px; padding: 7px 10px; margin: -4px 2px 10px; }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #results.quiet .card { animation: none; }
  .pendingline { display: flex; align-items: center; gap: 8px; color: var(--muted);
    font-size: 12px; padding: 2px 4px 10px; }
  .pendingline .spinner { width: 12px; height: 12px; border-width: 2px; }
  .loading { display: flex; align-items: center; justify-content: center;
    gap: 10px; color: var(--muted); padding: 28px 0; font-size: 12.5px; }
  .spinner { width: 16px; height: 16px; border-radius: 50%;
    border: 2.5px solid var(--chip); border-top-color: var(--accent);
    animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* detail view */
  #detail { display: none; }
  body.detail-open #results { display: none; }
  body.detail-open #detail { display: block;
    animation: slidein .32s cubic-bezier(.2,.7,.3,1) both; }
  /* comes in from the right with a tiny overshoot + materialize */
  @keyframes slidein {
    0%   { opacity: 0; transform: translateX(26px) scale(.98); filter: blur(4px); }
    70%  { opacity: 1; transform: translateX(-3px) scale(1);   filter: blur(0);   }
    100% { opacity: 1; transform: translateX(0)    scale(1);   filter: blur(0);   }
  }
  /* exit is quieter than the entrance (attention is already moving on) */
  body.detail-closing #results { display: none; }
  body.detail-closing #detail { display: block;
    animation: slideout .22s cubic-bezier(.4,0,1,1) both; }
  @keyframes slideout {
    to { opacity: 0; transform: translateX(14px) scale(.99); filter: blur(3px); }
  }
  .ibtn:active, #go:active, .seg button:active, .back:active,
  .morebtn:active { transform: scale(.94); }

  /* Accessibility: honour reduced-motion. Disables the entrances, the detail
     slide, and the pre-existing looping "live" pulses while preserving final
     states so nothing breaks. Required for every animation in this file. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* zoom controls restyled to match the app: card material, rounded,
     custom +/- glyphs */
  .maplibregl-ctrl-group { background: var(--card-solid) !important;
    border-radius: 12px !important; box-shadow: var(--shadow) !important;
    overflow: hidden; }
  .maplibregl-ctrl-group button { width: 34px !important; height: 34px !important;
    background: transparent !important; }
  .maplibregl-ctrl-group button + button {
    border-top: .5px solid var(--line) !important; }
  .maplibregl-ctrl-group button:hover { background: var(--chip) !important; }
  .maplibregl-ctrl-group button:active { background: var(--chip) !important; }
  /* hide MapLibre's baked-in icon images; draw crisp glyphs instead */
  .maplibregl-ctrl-zoom-in .maplibregl-ctrl-icon,
  .maplibregl-ctrl-zoom-out .maplibregl-ctrl-icon { background-image: none !important; }
  .maplibregl-ctrl-zoom-in, .maplibregl-ctrl-zoom-out { position: relative; }
  .maplibregl-ctrl-zoom-in::after, .maplibregl-ctrl-zoom-out::after {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: var(--text); font-size: 19px;
    font-weight: 400; line-height: 1; }
  .maplibregl-ctrl-zoom-in::after { content: "+"; }
  .maplibregl-ctrl-zoom-out::after { content: "\2212"; }
  /* map popups (Bike Share dock hover) match the app card so the text is
     readable in dark mode */
  .maplibregl-popup-content { background: var(--card-solid) !important;
    color: var(--text) !important; border-radius: 10px !important;
    box-shadow: var(--shadow) !important; padding: 8px 11px !important;
    font: inherit; font-size: 12.5px; }
  .maplibregl-popup-content b { color: var(--text); }
  .maplibregl-popup-tip { border-top-color: var(--card-solid) !important;
    border-bottom-color: var(--card-solid) !important; }
  .maplibregl-popup-anchor-top .maplibregl-popup-tip,
  .maplibregl-popup-anchor-top-left .maplibregl-popup-tip,
  .maplibregl-popup-anchor-top-right .maplibregl-popup-tip
    { border-bottom-color: var(--card-solid) !important; }

  /* map look button: standalone, top-right */
  #lookBtn { position: absolute; top: 62px; right: 14px; z-index: 6;
    width: 40px; height: 40px; border: none; border-radius: 12px;
    background: var(--card-solid); color: var(--text); cursor: pointer;
    box-shadow: var(--shadow); display: flex; align-items: center;
    justify-content: center; }
  #lookBtn:hover { background: var(--chip); }
  #lookBtn:active { transform: scale(.94); }
  /* 3D tilt toggle, bottom of the right-hand column: Reach / layers / 3D.
     All three are equal-sized icons, and the reach panel opens to the left
     because a card in the column would cover the buttons below it. */
  #d3Btn { position: absolute; top: 110px; right: 14px; z-index: 6;
    width: 40px; height: 40px; border: none; border-radius: 12px;
    background: var(--card-solid); color: var(--text); cursor: pointer;
    box-shadow: var(--shadow); font: 600 14px/1 -apple-system, sans-serif;
    letter-spacing: .2px; display: flex; align-items: center;
    justify-content: center; }
  #d3Btn:hover { background: var(--chip); }
  #d3Btn:active { transform: scale(.94); }
  #d3Btn.on { background: var(--accent); color: #fff; }
  /* compass: only shows once the map is tilted or turned off north, so the
     column stays three icons tall in plain 2D. Drag it to turn, tap it to
     face north. */
  #compassBtn { position: absolute; top: 158px; right: 14px; z-index: 6;
    width: 40px; height: 40px; border: none; border-radius: 12px;
    background: var(--card-solid); color: var(--text); cursor: grab;
    box-shadow: var(--shadow); display: flex; align-items: center;
    justify-content: center; padding: 0; touch-action: none;
    opacity: 0; transform: scale(.8); pointer-events: none;
    transition: opacity .18s ease, transform .18s ease; }
  #compassBtn.show { opacity: 1; transform: none; pointer-events: auto; }
  #compassBtn:hover { background: var(--chip); }
  #compassBtn.turning { cursor: grabbing; background: var(--chip); }
  #compassBtn svg { display: block; }
  /* opens to the LEFT of the layers button so it clears the column below */
  #lookPop { position: absolute; top: 62px; right: 62px; z-index: 7;
    background: var(--card-solid); border-radius: 12px; box-shadow: var(--shadow);
    padding: 6px; display: none; min-width: 172px; }
  #lookPop.open { display: block; }
  #lookPop .lp-h { font-size: 11px; font-weight: 700; letter-spacing: .02em;
    color: var(--muted); padding: 4px 9px 6px; }
  #lookPop button { display: flex; align-items: center; width: 100%;
    border: none; background: none; color: var(--text); font: inherit;
    font-size: 13px; font-weight: 550; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; text-align: left; }
  #lookPop button:hover { background: var(--chip); }
  #lookPop button.on { font-weight: 700; color: var(--accent); }
  #lookPop button.on::after { content: "\2713"; margin-left: auto;
    font-weight: 700; }
  .lp-sep { height: .5px; background: var(--line); margin: 5px 6px; }

  /* "More" actions menu (Share / Clear / Service alerts) - hangs off the
     ellipsis button in the controls row, keeps those actions off the panel */
  .morewrap { position: relative; display: inline-flex; }
  [hidden] { display: none !important; }   /* .ibtn's display was overriding it */
  /* fixed so the panel's scroll box can't clip it; JS sets top/left on open */
  #moreMenu { position: fixed; z-index: 60;
    background: var(--card-solid); border-radius: 12px; box-shadow: var(--shadow);
    padding: 6px; display: none; width: 236px; }
  #moreMenu.open { display: block; }
  .mm-item { display: flex; align-items: center; gap: 8px; width: 100%;
    border: none; background: none; color: var(--text); font: inherit;
    font-size: 13px; font-weight: 550; padding: 9px 10px;
    border-radius: 8px; cursor: pointer; text-align: left; }
  .mm-item:hover { background: var(--chip); }
  .mm-sep { height: .5px; background: var(--line); margin: 5px 6px; }
  .mm-alertstog .mm-lbl { flex: 1; }
  .mm-count { font-size: 11px; font-weight: 700; color: #ff9f0a;
    background: color-mix(in srgb, #ff9f0a 16%, transparent);
    padding: 1px 7px; border-radius: 999px; }
  .mm-chev { margin-left: 6px; color: var(--muted); transition: transform .18s ease; }
  .mm-chev::after { content: "\203A"; font-size: 15px; }
  .mm-alertstog[aria-expanded="true"] .mm-chev { transform: rotate(90deg); }
  .mm-alerts { display: none; max-height: 240px; overflow-y: auto;
    padding: 2px 4px 4px; }
  .mm-alerts.open { display: block; }
  .mm-alerts .abitem { font-size: 12px; padding: 6px 6px; border-radius: 6px; }
  .mm-alerts .abitem + .abitem { border-top: .5px solid var(--line); }
  .mm-alerts .ah { color: var(--text); font-weight: 600; }
  .mm-alerts .ad { color: var(--muted); font-weight: 400; margin-top: 2px;
    line-height: 1.35; }
  .mm-alerts .al { display: inline-block; margin-top: 3px; color: var(--accent);
    font-size: 11.5px; text-decoration: none; }
  .mm-noalerts { font-size: 12px; color: var(--muted); padding: 9px 10px; }
  /* a small amber dot on the ellipsis when alerts are active */
  #moreBtn.hasalerts { position: relative; }
  #moreBtn.hasalerts::after { content: ""; position: absolute; top: 5px; right: 5px;
    width: 6px; height: 6px; border-radius: 50%; background: #ff9f0a; }

  /* map markers - Apple "you are here" halo dots (start green, end red) */
  .mk { cursor: grab; line-height: 0; }
  .mk:active { cursor: grabbing; }
  .mk svg { display: block; }
  .mkbody { animation: pinpop .38s cubic-bezier(.2,.7,.3,1.5) both; }
  @keyframes pinpop {
    0% { transform: scale(.2); opacity: 0; }
    70% { transform: scale(1.12); opacity: 1; }
    100% { transform: scale(1); } }
  /* labeled Bike Share dock pin for the selected trip */
  .dockmk { animation: pinpop .38s cubic-bezier(.2,.7,.3,1.5) both;
    display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
    background: #1e9e4a; color: #fff; font-size: 12px; font-weight: 650;
    padding: 4px 9px 4px 7px; border-radius: 999px; white-space: nowrap;
    box-shadow: 0 1.4px 5px rgba(0,0,0,.4); border: 1.6px solid #fff; }
  .dockmk .icn { width: 14px; height: 14px; }
  /* nearby-dock list in the trip detail */
  .docklist { margin-top: 12px; }
  .docklist h3 { font-size: 12px; font-weight: 650; color: var(--muted);
    margin: 0 0 7px; }
  .dockrow { display: flex; align-items: center; gap: 8px; width: 100%;
    background: var(--card); border: .5px solid var(--line); text-align: left;
    border-radius: 12px; padding: 9px 11px; margin-bottom: 6px; cursor: pointer;
    color: var(--text); font: inherit; box-shadow: var(--card-shadow); }
  .dockrow:hover { background: var(--chip); }
  .dockrow.here { border-color: #34c759; border-width: 1px; }
  .dockrow .dot { width: 9px; height: 9px; border-radius: 999px;
    background: #34c759; flex: none; }
  .dockrow .nm { font-size: 13px; font-weight: 600; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dockrow .cnt { font-size: 12px; color: var(--muted); flex: none; }
  .dockrow .tag { font-size: 10px; font-weight: 700; color: #fff;
    background: #34c759; padding: 1px 7px; border-radius: 999px; flex: none; }
  .dhead { display: flex; align-items: center; gap: 10px; margin: 2px 0 12px; }
  .back { border: none; background: var(--chip); color: var(--text);
    width: 30px; height: 30px; border-radius: 999px; cursor: pointer;
    font-size: 14px; flex: none; display: inline-flex; align-items: center;
    justify-content: center; }
  .dhead .mins { font-size: 20px; }
  .dhead .dcost { margin-left: auto; font-size: 17px; font-weight: 700;
    color: var(--good); }
  .tl { background: var(--card); border: .5px solid var(--line);
    border-radius: 14px; box-shadow: var(--card-shadow); padding: 14px 14px 6px; }
  .step { display: grid; grid-template-columns: 52px 20px 1fr; gap: 0 8px; }
  .step .t { font-size: 11px; font-weight: 650; color: var(--muted);
    padding-top: 2px; text-align: right; font-variant-numeric: tabular-nums; }
  .step .rail { position: relative; }
  .step .rail .dot { width: 11px; height: 11px; border-radius: 50%;
    background: var(--card-solid); border: 3px solid var(--rail, #9aa3b8);
    position: absolute; left: 2px; top: 3px; }
  .step .rail .bar { position: absolute; left: 6px; top: 16px; bottom: -3px;
    width: 3px; border-radius: 2px; background: var(--rail, #9aa3b8); opacity: .9; }
  .step.walkstep .rail .bar { background: repeating-linear-gradient(
    var(--rail, #9aa3b8) 0 4px, transparent 4px 8px); }
  .step:last-child .rail .bar { display: none; }
  .step .body { padding-bottom: 16px; min-width: 0; }
  .step .what { font-weight: 650; font-size: 13px; }
  .step .what .icn { color: var(--muted); margin-right: 2px; }
  .step .sub { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
  /* which-subway-car diagram (train drawn pointing right = direction of travel) */
  .btrain { display: flex; align-items: center; gap: 2.5px; margin-top: 8px; }
  .bcar { width: 26px; height: 13px; border-radius: 3.5px; background: var(--chip);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; color: #fff; flex: none; }
  .bcar.nose { border-radius: 3.5px 9px 9px 3.5px; }
  .bcar.hot { background: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .bdir { color: var(--muted); display: inline-flex; margin-left: 2px; font-size: 11px; }
  .bnote { color: var(--muted); font-size: 11px; margin-top: 5px; line-height: 1.45; }
  .bnote b { color: var(--text); font-weight: 650; }

  .fares { background: var(--card); border: .5px solid var(--line);
    border-radius: 14px; box-shadow: var(--card-shadow); padding: 12px 14px;
    margin-top: 10px; }
  .fares h3 { margin: 0 0 6px; font-size: 11px; font-weight: 650;
    text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .fitem { display: flex; justify-content: space-between; gap: 10px;
    font-size: 12.5px; padding: 2.5px 0; font-variant-numeric: tabular-nums; }
  .fitem.total { border-top: .5px solid var(--line); margin-top: 5px;
    padding-top: 7px; font-weight: 700; font-size: 13.5px; }
  .fnote { color: var(--muted); font-size: 11px; margin-top: 7px; }

  /* ---- Reach mode ---- */
  /* the panel hangs to the LEFT of the reach icon (same trick as #lookPop)
     so the layers/3D icons below it stay clickable */
  #reachCard { position: absolute; top: 14px; right: 62px; z-index: 7;
    width: 216px; background: var(--panel);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  #reachToggle { width: 100%; border: none; background: transparent;
    color: var(--text); font: inherit; font-weight: 650; cursor: pointer;
    padding: 11px 14px; display: flex; align-items: center; gap: 8px;
    text-align: left; }
  #reachToggle .rt-dot { width: 9px; height: 9px; border-radius: 50%;
    background: var(--muted); flex: none; transition: background .2s; }
  #reachToggle.on { background: var(--chip); }
  #reachToggle.on .rt-dot { background: var(--accent); }
  #reachToggle:active { transform: scale(.98); }
  #reachBody { padding: 4px 14px 14px; }
  .reach-hint { font-size: 11.5px; color: var(--muted); line-height: 1.35;
    margin-bottom: 10px; }
  .reach-schemes { display: flex; gap: 6px; margin-bottom: 12px; }
  .reach-sw { flex: 1; border: 1px solid var(--line); background: transparent;
    border-radius: 9px; padding: 4px 4px 3px; cursor: pointer; }
  .reach-sw.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .reach-sw .sw-bar { display: flex; height: 8px; border-radius: 3px;
    overflow: hidden; }
  .reach-sw .sw-bar i { flex: 1; }
  .reach-sw .sw-name { font-size: 10.5px; color: var(--text); margin-top: 3px;
    text-align: center; }
  .reach-bar { height: 9px; border-radius: 4px; }
  .reach-scale { display: flex; justify-content: space-between;
    font-size: 10px; color: var(--muted); margin-top: 4px; }
  .reach-pulse { width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 0 rgba(10,132,255,.5);
    animation: reachpulse 1.1s ease-out infinite; }
  @keyframes reachpulse {
    0% { box-shadow: 0 0 0 0 rgba(10,132,255,.5); }
    100% { box-shadow: 0 0 0 22px rgba(10,132,255,0); } }
  /* the card's own X is gone: the column icon below is the show/hide toggle
     and its label tracks state, so the two used to sit 18px apart carrying
     the same "Hide the reach map" action. One control, one label. */
  /* top of the right-hand column, and shaped like its two neighbours so the
     three read as one stack rather than a pill sitting on two squares */
  #reachLauncher { position: absolute; top: 14px; right: 14px; z-index: 6;
    width: 40px; height: 40px; border-radius: 12px; border: none;
    background: var(--card-solid); box-shadow: var(--shadow);
    color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center; }
  #reachLauncher:hover { background: var(--chip); }
  #reachLauncher:active { transform: scale(.94); }
  #reachLauncher.on { background: var(--accent); color: #fff; }
  #toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 12px);
    background: var(--card-solid); color: var(--text); font-size: 13px; font-weight: 600;
    padding: 9px 15px; border-radius: 999px; box-shadow: 0 6px 22px rgba(0,0,0,.22);
    z-index: 60; opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="map"></div>

<div id="panel"><div id="panelScroll">
  <div class="wordmark">GTA Router</div>
  <div class="search">
    <div class="srow"><span class="pt pick" id="dotFrom" data-field="from"
      style="background:#34c759;color:#34c759"
      title="Set the start: click this, then click the map"
      aria-label="Set the start point, then click the map" role="button" tabindex="0"></span>
      <input id="fromBox" type="text" aria-label="Start"></div>
    <div class="srow"><span class="pt pick" id="dotTo" data-field="to"
      style="background:#ff453a;color:#ff453a"
      title="Set the destination: click this, then click the map"
      aria-label="Set the destination, then click the map" role="button" tabindex="0"></span>
      <input id="toBox" type="text" aria-label="End"></div>
  </div>
  <div class="ctrls">
    <div class="seg" id="whenSeg" title="Plan by when you leave, or when you need to be there">
      <button data-when="depart" class="on" aria-pressed="true">Leave at</button>
      <button data-when="arrive" aria-pressed="false">Arrive by</button>
    </div>
    <span style="flex-basis:100%"></span>
    <select id="daySel" title="Day"></select>
    <select id="timeSel" title="Time"></select>
  </div>
  <div class="ctrls">
    <button class="ibtn" id="swap" title="Swap start and end"
      aria-label="Swap start and end"></button>
    <span class="morewrap">
      <button class="ibtn" id="moreBtn" title="More" aria-label="More actions"
        aria-haspopup="true" aria-expanded="false"></button>
      <div id="moreMenu" role="menu">
        <button class="mm-item" id="mmShare" role="menuitem">Share trip</button>
        <button class="mm-item" id="mmClear" role="menuitem">Clear</button>
        <div class="mm-sep"></div>
        <button class="mm-item mm-alertstog" id="mmAlertsToggle" role="menuitem"
          aria-expanded="false" hidden>
          <span class="mm-lbl">Service alerts</span>
          <span class="mm-count" id="mmAlertCount"></span>
          <span class="mm-chev"></span></button>
        <div id="moreAlerts" class="mm-alerts"></div>
        <div class="mm-noalerts" id="mmNoAlerts" hidden>No current service alerts</div>
      </div>
    </span>
    <button id="go">Plan trip</button>
  </div>
  <button class="optsrow" id="optsBtn" aria-expanded="false"
    aria-controls="optWrap"></button>
  <div id="optWrap">
    <div class="optgrp">
      <div class="optlbl">What you've got</div>
      <div class="optrow haverow">
        <span class="havelbl">Bike</span>
        <button class="have on" id="haveBike" data-have="bike"
          title="I can bike to a stop and lock my bike there"></button>
        <button class="have on" id="haveShare" data-have="share"
          title="OK with renting a Bike Share Toronto bike"></button>
      </div>
      <div class="optrow haverow">
        <span class="havelbl">Car</span>
        <button class="have on" id="haveCarStart" data-have="carStart"
          title="You can drive to a station and park (park and ride)"></button>
        <button class="have on" id="haveCarEnd" data-have="carEnd"
          title="A car for the last leg - a pickup, or your car waiting at the station"></button>
      </div>
    </div>
    <div class="optgrp">
      <div class="optlbl">Who's riding</div>
      <div class="optrow">
        <div class="seg" id="riderSeg" title="Fare type">
          <button data-rider="adult" class="on" aria-pressed="true">Adult</button>
          <button data-rider="youth" aria-pressed="false">Youth 13&ndash;19</button>
        </div>
      </div>
    </div>
    <div class="optgrp">
      <div class="optlbl">Preferences</div>
      <div class="optrow">
        <select id="bikeSel" title="Safest sticks to bike lanes and quiet streets; fastest allows busier roads when they save time">
          <option value="safest" selected>Bike: safest</option>
          <option value="balanced">Bike: balanced</option>
          <option value="fastest">Bike: fastest</option>
        </select>
        <button class="have" id="noTolls" aria-pressed="false"
          title="Hide any option whose drive uses Highway 407">Avoid tolls</button>
      </div>
    </div>
    <div class="optgrp">
      <label class="optlbl slbl" for="driveRange">
        <span>Longest drive</span><b id="driveVal">15 km</b></label>
      <div class="optrow sliderrow">
        <input type="range" class="slider" id="driveRange" min="5" max="60" step="5"
          value="15" aria-label="Longest drive (to the station, or at the end)">
        <button type="button" class="slhint" id="driveHint" hidden>
          <span class="sh-txt"></span><span class="sh-act">Show</span></button>
      </div>
    </div>
  </div>
  <div id="results">
    <div class="hint">Pick a start and an end to compare every mix of
      transit, driving, your bike and Bike Share, with real fares.</div>
  </div>
  <div id="detail"></div>
</div></div>

<script defer src="app.js"></script>
</body>
</html>
